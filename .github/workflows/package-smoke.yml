name: Windows portable package smoke

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/package-smoke.yml"
      - "ArchMeshRubbing.spec"
      - "LICENSE"
      - "README.md"
      - "main.py"
      - "app_interactive.py"
      - "requirements/build-py312.lock"
      - "requirements/runtime-py312.lock"
      - "requirements/runtime-license-policy.json"
      - "requirements/windows-py312-x64-hashed.lock"
      - "resources/**"
      - "schemas/**"
      - "src/**"
      - "third_party_licenses/**"
      - "tools/build_portable_archive.py"
      - "tools/generate_build_info.py"
      - "tools/generate_release_evidence.py"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/package-smoke.yml"
      - "ArchMeshRubbing.spec"
      - "LICENSE"
      - "README.md"
      - "main.py"
      - "app_interactive.py"
      - "requirements/build-py312.lock"
      - "requirements/runtime-py312.lock"
      - "requirements/runtime-license-policy.json"
      - "requirements/windows-py312-x64-hashed.lock"
      - "resources/**"
      - "schemas/**"
      - "src/**"
      - "third_party_licenses/**"
      - "tools/build_portable_archive.py"
      - "tools/generate_build_info.py"
      - "tools/generate_release_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-package-smoke:
    name: Portable package smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/build-py312.lock
            requirements/runtime-py312.lock
            requirements/windows-py312-x64-hashed.lock

      - name: Install hash-locked Windows wheel set
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement requirements/windows-py312-x64-hashed.lock

      - name: Validate installed dependency closure
        run: python -m pip check

      - name: Generate immutable build manifest
        run: >-
          python tools/generate_build_info.py
          --channel ci-smoke
          --commit "${{ github.sha }}"
          --output build/generated/build_info.json

      - name: Build frozen application
        run: python -m PyInstaller --clean --noconfirm ArchMeshRubbing.spec

      - name: Generate payload manifest, SPDX SBOM, and notices
        shell: pwsh
        run: |
          $createdAt = (& git show -s --format=%cI "${{ github.sha }}").Trim()
          if (-not $createdAt) {
            throw "Could not read deterministic source commit timestamp"
          }
          python tools/generate_release_evidence.py generate `
            --payload "dist\ArchMeshRubbing" `
            --created-at $createdAt

      - name: Re-verify release evidence from payload bytes
        run: >-
          python tools/generate_release_evidence.py verify
          --payload dist/ArchMeshRubbing

      - name: Run frozen self-test (Windows)
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist\ArchMeshRubbing\ArchMeshRubbing.exe" `
            -ArgumentList "--self-test-report", "build\frozen-self-test.json" `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Frozen self-test exceeded 120 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "Frozen self-test exited with code $($process.ExitCode)"
          }

      - name: Validate frozen self-test report
        run: >-
          python -c "import json,pathlib;
          p=pathlib.Path('build/frozen-self-test.json');
          d=json.loads(p.read_text(encoding='utf-8'));
          assert d.get('ok') is True, json.dumps(d, ensure_ascii=False, indent=2);
          checks=d.get('checks') or [];
          assert len(checks) == 13 and all(c.get('ok') is True for c in checks), d;
          assert any(c.get('name') == 'artifact_complete_workflow_offline' for c in checks), d;
          assert any(c.get('name') == 'release_evidence' for c in checks), d;
          print('Frozen self-test passed:', p)"

      - name: Run frozen Windows native-QPA OpenGL smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_LOGGING_RULES: "qt.qpa.gl=true"
          QT_OPENGL: software
        run: |
          $process = Start-Process `
            -FilePath "dist\ArchMeshRubbing\ArchMeshRubbing.exe" `
            -ArgumentList "--opengl-driver-smoke-report", "build\frozen-windows-opengl-driver-smoke.json" `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Frozen OpenGL smoke exceeded 120 seconds"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path "build\frozen-windows-opengl-driver-smoke.json") {
              Get-Content "build\frozen-windows-opengl-driver-smoke.json"
            }
            throw "Frozen OpenGL smoke exited with code $($process.ExitCode)"
          }

      - name: Validate frozen Windows OpenGL evidence report
        run: >-
          python -c "import json,pathlib;
          p=pathlib.Path('build/frozen-windows-opengl-driver-smoke.json');
          d=json.loads(p.read_text(encoding='utf-8'));
          assert d.get('ok') is True, json.dumps(d,ensure_ascii=False,indent=2);
          c=d.get('context') or {};
          assert c.get('qt_platform') == 'windows', c;
          assert c.get('software_renderer') is True, c;
          assert len(d.get('render_modes') or []) == 2, d;
          assert d.get('checks') and all(x.get('ok') is True for x in d['checks']), d;
          print('Frozen Windows native-QPA OpenGL smoke passed:', c.get('renderer'))"

      - name: Build and verify deterministic portable archive
        shell: pwsh
        run: |
          $buildInfo = Get-Content "build\generated\build_info.json" -Raw | ConvertFrom-Json
          $epochText = (& git show -s --format=%ct "${{ github.sha }}").Trim()
          if ($epochText -notmatch '^\d+$') {
            throw "Could not read source commit epoch"
          }
          $outputDir = New-Item -ItemType Directory -Path "build\portable" -Force
          $archiveName = "ArchMeshRubbing-$($buildInfo.version)-Windows-x64-portable.zip"
          $archive = Join-Path $outputDir.FullName $archiveName
          $manifest = "$archive.manifest.json"
          python tools/build_portable_archive.py build `
            --payload "dist\ArchMeshRubbing" `
            --archive $archive `
            --manifest $manifest `
            --source-date-epoch ([int64]$epochText)
          if ($LASTEXITCODE -ne 0) {
            throw "Portable archive build failed"
          }
          python tools/build_portable_archive.py verify `
            --archive $archive `
            --manifest $manifest
          if ($LASTEXITCODE -ne 0) {
            throw "Portable archive verification failed"
          }
          $portable = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($portable.release_evidence.source_commit -ne "${{ github.sha }}") {
            throw "Portable archive source commit does not match the workflow"
          }
          $signature = Get-AuthenticodeSignature "dist\ArchMeshRubbing\ArchMeshRubbing.exe"
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "CI executable must remain unsigned; status was $($signature.Status)"
          }
          Write-Host "Portable archive $archiveName: $($portable.archive.sha256), $($portable.payload.file_count) files"
          "AMR_PORTABLE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AMR_PORTABLE_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and extract portable archive into Korean path
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP "문화유산 기록\ArchMeshRubbing"
          if (Test-Path $portableDir) {
            throw "Refusing to reuse portable smoke path: $portableDir"
          }
          python tools/build_portable_archive.py extract `
            --archive $env:AMR_PORTABLE_ARCHIVE `
            --manifest $env:AMR_PORTABLE_MANIFEST `
            --destination $portableDir
          if ($LASTEXITCODE -ne 0) {
            throw "Portable archive extraction failed"
          }
          python tools/generate_release_evidence.py verify --payload $portableDir
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted release evidence verification failed"
          }
          $portableExe = Join-Path $portableDir "ArchMeshRubbing.exe"
          if (-not (Test-Path $portableExe -PathType Leaf)) {
            throw "Portable executable is missing: $portableExe"
          }
          "AMR_PORTABLE_DIR=$portableDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AMR_PORTABLE_EXE=$portableExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enforce portable executable offline boundary
        shell: pwsh
        run: |
          $ruleName = "ArchMeshRubbing CI offline $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-NetFirewallRule `
            -DisplayName $ruleName `
            -Direction Outbound `
            -Program $env:AMR_PORTABLE_EXE `
            -Action Block `
            -Profile Any | Out-Null
          "AMR_FIREWALL_RULE=$ruleName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $rule = Get-NetFirewallRule -DisplayName $ruleName
          $application = $rule | Get-NetFirewallApplicationFilter
          if ($rule.Enabled.ToString() -ne "True" -or $rule.Action.ToString() -ne "Block") {
            throw "Outbound deny rule is not enabled"
          }
          if ([IO.Path]::GetFullPath($application.Program) -ne [IO.Path]::GetFullPath($env:AMR_PORTABLE_EXE)) {
            throw "Outbound deny rule targets the wrong executable: $($application.Program)"
          }
          Write-Host "Outbound network blocked for $($application.Program)"

      - name: Run portable offline workflow self-test from Korean path
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          $reportDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "유물 결과") -Force
          $report = Join-Path $reportDir.FullName "오프라인-자체검증.json"
          $process = Start-Process `
            -FilePath $env:AMR_PORTABLE_EXE `
            -ArgumentList "--self-test-report", "`"$report`"" `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Portable self-test exceeded 120 seconds"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Portable self-test exited with code $($process.ExitCode)"
          }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $data.ok -or $data.checks.Count -ne 13) {
            Get-Content $report
            throw "Portable self-test did not pass all 13 checks"
          }
          foreach ($check in $data.checks) {
            if (-not $check.ok) { throw "Portable self-test check failed: $($check.name)" }
          }
          if (-not ($data.checks.name -contains "artifact_complete_workflow_offline")) {
            throw "Portable self-test omitted the complete offline workflow"
          }
          if (-not ($data.checks.name -contains "release_evidence")) {
            throw "Portable self-test omitted release evidence verification"
          }

      - name: Run portable Windows native-QPA OpenGL smoke from Korean path
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_LOGGING_RULES: "qt.qpa.gl=true"
          QT_OPENGL: software
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          $reportDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "유물 결과") -Force
          $report = Join-Path $reportDir.FullName "윈도우-화면검증.json"
          $process = Start-Process `
            -FilePath $env:AMR_PORTABLE_EXE `
            -ArgumentList "--opengl-driver-smoke-report", "`"$report`"" `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Portable OpenGL smoke exceeded 120 seconds"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Portable OpenGL smoke exited with code $($process.ExitCode)"
          }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          $context = $data.context
          if (-not $data.ok -or $context.qt_platform -ne "windows" -or -not $context.software_renderer) {
            Get-Content $report
            throw "Portable OpenGL smoke did not use the required Windows software context"
          }
          if ($data.render_modes.Count -ne 2) {
            throw "Portable OpenGL smoke omitted a projection mode"
          }
          foreach ($check in $data.checks) {
            if (-not $check.ok) { throw "Portable OpenGL check failed: $($check.name)" }
          }
          Write-Host "Portable actual-frame checks passed: $($data.checks.Count)"

      - name: Remove portable payload and verify cleanup
        shell: pwsh
        run: |
          python tools/build_portable_archive.py verify `
            --archive $env:AMR_PORTABLE_ARCHIVE `
            --manifest $env:AMR_PORTABLE_MANIFEST
          if ($LASTEXITCODE -ne 0) {
            throw "Portable archive changed during runtime checks"
          }
          Remove-Item -LiteralPath $env:AMR_PORTABLE_DIR -Recurse -Force
          if (Test-Path $env:AMR_PORTABLE_DIR) {
            throw "Portable directory remains after deletion"
          }
          Write-Host "Portable extraction and cleanup passed."

      - name: Remove offline rule and residual smoke files
        if: always()
        shell: pwsh
        run: |
          if ($env:AMR_FIREWALL_RULE) {
            Get-NetFirewallRule -DisplayName $env:AMR_FIREWALL_RULE -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule -ErrorAction SilentlyContinue
          }
          if ($env:AMR_PORTABLE_DIR -and (Test-Path $env:AMR_PORTABLE_DIR)) {
            Remove-Item -LiteralPath $env:AMR_PORTABLE_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }

      # Deliberately no artifact upload or release step. Public binary
      # distribution remains disabled until the repository license gate is
      # resolved.
