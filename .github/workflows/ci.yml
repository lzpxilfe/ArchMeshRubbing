name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/runtime-py312.lock
            requirements-dev.txt

      - name: Install Linux Qt import runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libglu1-mesa \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (M0 trust kernel)
        run: >-
          python -c "import subprocess,sys;
          raise SystemExit(subprocess.call([sys.executable,'-m','pyright',
          '--pythonpath',sys.executable,'-p','pyright-m0.json']))"

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Full-tree type debt report
        continue-on-error: true
        run: >-
          python -m pyright
          --pythonpath "$(python -c 'import sys; print(sys.executable)')"
          -p pyrightconfig.json

  windows-workflow-smoke:
    name: Windows offline workflow smoke
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/runtime-py312.lock
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Persistence, artifact, identity, workflow, and GUI smoke
        run: >-
          python -m pytest -q
          tests/test_project_file.py
          tests/test_build_info.py
          tests/test_build_native.py
          tests/test_portable_archive.py
          tests/test_source_archive.py
          tests/test_build_manifest.py
          tests/test_release_evidence.py
          tests/test_source_identity.py
          tests/test_mesh_import_recipe.py
          tests/test_mesh_external_dependencies.py
          tests/test_mesh_verified_stream.py
          tests/test_alignment_utils.py
          tests/test_artifact_document.py
          tests/test_geometry_identity.py
          tests/test_artifact_scene_adapter.py
          tests/test_artifact_session.py
          tests/test_artifact_workbench.py
          tests/test_artifact_workflow_progress.py
          tests/test_artifact_workflow_self_test.py
          tests/test_artifact_exports.py
          tests/test_artifact_measurements.py
          tests/test_artifact_new_process_roundtrip.py
          tests/test_canonical_json.py
          tests/test_artifact_vector_record.py
          tests/test_artifact_vector_export.py
          tests/test_artifact_vector_extractor.py
          tests/test_artifact_outline_extractor.py
          tests/test_artifact_outline_topology.py
          tests/test_artifact_rubbing_extractor.py
          tests/test_artifact_rubbing_export.py
          tests/test_artifact_tile_unwrap.py
          tests/test_artifact_tile_unwrap_export.py
          tests/test_canonical_png.py
          tests/test_vector_schemas.py
          tests/test_rubbing_schemas.py
          tests/test_render_coordinates.py
          tests/test_viewport_render_origin.py
          tests/test_opengl_driver_smoke.py
          tests/test_rotation_convention.py
          tests/test_app_gui_launcher.py
          tests/test_gui_smoke.py

      - name: Windows software OpenGL native-QPA smoke
        env:
          PYTHONUNBUFFERED: "1"
          QT_QPA_PLATFORM: windows
          QT_LOGGING_RULES: "qt.qpa.gl=true"
          QT_OPENGL: software
        run: >-
          python -m src.gui.opengl_driver_smoke
          --qt-platform windows
          --report build/windows-opengl-driver-smoke.json

      - name: Validate Windows OpenGL evidence report
        run: >-
          python -c "import json,pathlib;
          p=pathlib.Path('build/windows-opengl-driver-smoke.json');
          d=json.loads(p.read_text(encoding='utf-8'));
          assert d.get('ok') is True, json.dumps(d,ensure_ascii=False,indent=2);
          c=d.get('context') or {};
          assert c.get('qt_platform') == 'windows', c;
          assert c.get('software_renderer') is True, c;
          assert len(d.get('render_modes') or []) == 2, d;
          assert d.get('checks') and all(x.get('ok') is True for x in d['checks']), d;
          print('Windows native-QPA OpenGL smoke passed:', c.get('renderer'))"
